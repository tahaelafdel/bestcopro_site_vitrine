server {
    listen 80;
    listen [::]:80;

    server_name bestcopro.ma www.bestcopro.ma;
    root /var/www/bestcopro/current;
    index index.html;

    access_log /var/log/nginx/bestcopro.access.log;
    error_log /var/log/nginx/bestcopro.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

